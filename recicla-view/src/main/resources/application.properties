spring.application.name=recicla-view
server.port=${PORT:8080}

# ===== Banco de dados (MySQL na Hostinger) =====
# Em producao: defina DB_URL, DB_USER e DB_PASSWORD como variaveis de ambiente no servico de hospedagem.
# Localmente: crie o arquivo application-local.properties (ele NAO vai para o GitHub).
spring.datasource.url=${DB_URL:jdbc:mysql://HOST:3306/NOME_DO_BANCO?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:USUARIO_DO_BANCO}
spring.datasource.password=${DB_PASSWORD:SENHA_DO_BANCO}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=20000

# ===== JPA / Hibernate =====
# validate = apenas confere se as entidades batem com as tabelas (nao altera o banco)
# Se der erro de validacao por causa dos ENUMs, troque para: none
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# ===== Seguranca =====
# Segredo usado para assinar os tokens de login. EM PRODUCAO defina AUTH_SECRET com um texto longo e aleatorio.
app.auth.secret=${AUTH_SECRET:dev-troque-este-segredo-antes-de-publicar}

# Enderecos do front autorizados a chamar a API (separados por virgula).
app.cors.origens=${CORS_ORIGENS:http://localhost:*,http://127.0.0.1:*,https://nielvbsouza.github.io}

# ===== Mensagens de erro da API =====
server.error.include-message=always
server.error.include-binding-errors=never
